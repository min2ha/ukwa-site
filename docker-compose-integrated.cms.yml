
services:
  # Hugo site (production build)
  # Note: This service builds a production version of the site
  # For CMS work, use the hugo-dev service instead (port 1313)
  site:
    build:
      context: .
      dockerfile: Dockerfile.fixed
      args:
        http_proxy: ${HTTP_PROXY}
        https_proxy: ${HTTPS_PROXY}
    ports:
      - 1080:80
    depends_on:
      - git-gateway
    networks:
      - cms-network

  # Hugo development server (for live editing)
  hugo-dev:
    image: klakegg/hugo:0.111.3-ext-alpine
    command: server --bind 0.0.0.0 --buildDrafts --buildFuture --disableFastRender
    volumes:
      - .:/src
    ports:
      - 1313:1313
    environment:
      - HUGO_ENV=development
    networks:
      - cms-network

  # Decap CMS Git Gateway Proxy
  # This allows local development without needing Netlify Identity
  git-gateway:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install -g decap-server@latest && decap-server"
    ports:
      - 8081:8081
    volumes:
      - .:/repo:rw
    environment:
      - GIT_REPO_DIRECTORY=/repo
      - PORT=8081
    networks:
      - cms-network

  # Authentication proxy for user management
  # This simulates Git Gateway authentication for local development
  auth-proxy:
    image: nginx:alpine
    ports:
      - 8082:80
    volumes:
      - ./cms-config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./cms-config/users:/usr/share/nginx/html/users:ro
    networks:
      - cms-network

networks:
  cms-network:
    driver: bridge
