# Netlify Configuration for UKWA Static Site
# Site URL: https://ukwa-static.netlify.app

[build]
  command = "hugo --minify"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.111.3"
  HUGO_ENV = "production"
  HUGO_ENABLEGITINFO = "true"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview.environment]
  HUGO_ENV = "staging"

[[redirects]]
  from = "/en"
  to = "/en/ukwa"
  force = true

[[redirects]]
  from = "/cy"
  to = "/cy/ukwa"
  force = true

[[redirects]]
  from = "/gd"
  to = "/gd/ukwa"
  force = true

[[redirects]]
  from = "/info/faq"
  to = "/en/ukwa/info/faq"
  force = true

