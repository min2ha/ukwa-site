# Netlify Configuration for UKWA Static Site
# Main Site URL (development branch): https://ukwa-static.netlify.app
# Limited Access Site URL (dev_limited_access branch): https://static-ukwa-site.netlify.app

[build]
  command = "hugo --minify"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.111.3"
  HUGO_ENV = "production"
  HUGO_ENABLEGITINFO = "true"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview.environment]
  HUGO_ENV = "staging"

# Context for dev_limited_access branch
# Deploy to: https://static-ukwa-site.netlify.app
[context.dev_limited_access]
  command = "hugo --minify"

[context.dev_limited_access.environment]
  HUGO_ENV = "production"
  HUGO_VERSION = "0.111.3"
  HUGO_ENABLEGITINFO = "true"

[[redirects]]
  from = "/en"
  to = "/en/ukwa"
  force = true

[[redirects]]
  from = "/cy"
  to = "/cy/ukwa"
  force = true

[[redirects]]
  from = "/gd"
  to = "/gd/ukwa"
  force = true

[[redirects]]
  from = "/info/faq"
  to = "/en/ukwa/info/faq"
  force = true

